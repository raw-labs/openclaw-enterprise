name: Depot Sandbox Diagnostics
on:
  push:
    branches: [codex/depot-sandbox-diagnostics]
  workflow_dispatch:
permissions:
  contents: read
env:
  CI: "1"
jobs:
  sandbox:
    name: Depot sandbox diagnostics
    runs-on: ${{ vars.CI_RUNNER }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: images-runtime-startup
          profile: full
          node-version: "24.16.0"
          artifact-prefix: diagnostics
