name: Depot Fixture Diagnostics
on:
  push:
    branches: [codex/depot-sandbox-diagnostics]
    paths: [.github/workflows/fixture-diagnostics.yml]
permissions:
  contents: read
env:
  CI: "1"
  CI_RUNNER_FILE_CONCURRENCY: "1"
jobs:
  fixture:
    name: Serialized Depot Kubernetes fixtures
    runs-on: ${{ vars.CI_COMPAT_RUNNER }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: ./.github/actions/run-ci-lane
        with:
          lane: k3d-fixture-configuration
          profile: k3d
          node-version: "24.16.0"
          artifact-prefix: diagnostics
